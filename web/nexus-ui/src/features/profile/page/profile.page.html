<div class="profile-page-container">

    <profile-header 
        class="profile-header"
        [nickName]="userName()"
        [dateRegistration]="dateRegistration()"
        [avatarUrlInput]="avatarUrl()">
    </profile-header>

    <div class="profile-body">
        <div class="left-side-bar">
            <button 
                class="nav-btn"
                [class.active]="activeTab() === 'profile'"
                (click)="setActiveTab('profile')">
                <span class="icon">
                    <svg 
                        class="lucide lucide-users-icon lucide-users"
                        xmlns="http://www.w3.org/2000/svg" 
                        width="24" height="24" viewBox="0 0 24 24" 
                        fill="none" 
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                            <path d="M16 3.128a4 4 0 0 1 0 7.744"/>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                            <circle cx="9" cy="7" r="4"/>
                        </svg>
                    </span> 
                    Мой профиль
            </button>
            <button 
                class="nav-btn"
                [class.active]="activeTab() === 'projects'"
                (click)="setActiveTab('projects')">
                    <span class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-globe-icon lucide-globe">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
                            <path d="M2 12h20"/>
                        </svg>
                    </span> 
                    Сервисы
            </button>
            <button 
                class="nav-btn"
                [class.active]="activeTab() === 'settings'"
                (click)="setActiveTab('settings')">
                <span class="icon">
                    <svg 
                        class="lucide lucide-settings-icon lucide-settings"
                        xmlns="http://www.w3.org/2000/svg" 
                        width="24" height="24" viewBox="0 0 24 24" 
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </span> 
                    Настройки
            </button>
            <button class="nav-btn danger" (click)="logout()">
                <span class="icon">
                    <svg 
                        class="lucide lucide-log-out-icon lucide-log-out"
                        xmlns="http://www.w3.org/2000/svg" 
                        width="24" height="24" viewBox="0 0 24 24" 
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m16 17 5-5-5-5"/>
                            <path d="M21 12H9"/>
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        </svg>
                    </span> 
                    Выйти
            </button>
        </div>

        <div class="content">
            @switch (activeTab()) {
                @case ('profile') {
                    <profile-info
                    [login]="login()"
                    [email]="email()"
                    [dataRegistration]="dateRegistration()"></profile-info>
                }
                @case ('projects') {
                    <projects></projects>
                }
                @case ('settings') {
                    <settings></settings>
                }
            }
        </div>
    </div>

</div>
