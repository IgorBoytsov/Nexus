<div class="header-container">
    <div class="avatar-picker" (click)="fileInput.click()">
        
        <img
            class="avatar-img"
            [src]="avatarUrl()"
            alt="Avatar"
            (error)="onImageError($event)"/>
        
        <div class="avatar-overlay">
            <span class="camera-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-camera-icon lucide-camera"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/></svg></span>
        </div>

        <input
            #fileInput
            type="file"
            accept="image/jpeg, image/png, image/svg+xml"
            (change)="onFileSelected($event)"
            hidden/>
    </div>

    <div class="nick-name-container">
        <span class="nick-name">{{ nickName() }}</span>
    </div>

    <div class="date-registration-container">
        <svg 
            xmlns="http://www.w3.org/2000/svg" 
            width="24" height="24" viewBox="0 0 24 24" 
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 22h14"/>
                <path d="M5 2h14"/>
                <path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/>
                <path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/>
            </svg>
        <span>{{ registrationDuration() }}</span>
    </div>
</div>
