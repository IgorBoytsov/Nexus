services:

  nexus-auth-api:
    image: nexus/auth-api:latest
    container_name: nexus-auth-api
    ports:
      - "7000:80" 
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ServiceUrls__UserManagement=http://nexus-user-management-api:80
      - ConnectionStrings__DefaultConnection= <<Postgres_Sql>>
      - JwtSettings__Secret=
      - JwtSettings__ExpiryMinutes=
      - JwtSettings__Issuer=
      - JwtSettings__Audience=
      - Kafka__Consumer__BootstrapServers=
      - Kafka__Consumer__GroupId=nexus-authentication-service-consumer-group
      - Kafka__Consumer__AutoOffsetReset=Latest
      - Kafka__Consumer__EnableAutoCommit=false
      - Kafka__Consumer__EnablePartitionEof=false
      - Crypto__RsaPrivateKey=
      - Crypto__RsaPublicKey=
      - Redis__ConnectionString=
      - TokenCleanup__IntervalHours=
    restart: unless-stopped
    networks:
      - nexus-network

  nexus-user-management-api:
    image: nexus/user-management-api:latest
    container_name: nexus-user-management-api
    ports:
      - "7001:80" 
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection= <<Postgres_Sql>>
      - Redis__ConnectionString=
      - Urls__FileService=http://file-service:80
      - JwtSettings__Secret=
      - JwtSettings__Issuer=
      - JwtSettings__Audience=
      - OutboxCleanup__IntervalHours=
      - Kafka__Producer__BootstrapServers=
      - Kafka__Producer__Acks=All
      - Kafka__Producer__LingerMs=5
      - Kafka__Producer__BatchSize=16384
      - AutoMapper__AutoMapperKey=
    restart: unless-stopped
    networks:
      - nexus-network

  nexus-bff:
    image: nexus/bff:latest
    container_name: nexus-bff
    ports:
      - "7002:80" 
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Urls__AuthServices=http://nexus-auth-api:80/
      - Urls__UserManagement=http://nexus-user-management-api:80
      - Urls__FileService=http://file-service:80
      - Redis__ConnectionString=
    restart: unless-stopped
    depends_on:
      - nexus-auth-api
      - nexus-user-management-api
    networks:
      - nexus-network

  nexus-ui:
    image: nexus/ui:latest
    container_name: nexus-ui
    ports:
      - "7003:80"
    restart: unless-stopped
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge